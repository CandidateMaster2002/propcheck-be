server.port=8080

# PostgreSQL Datasource Configuration
# EDIT THESE PLACEHOLDERS for your environment
spring.datasource.url=jdbc:postgresql://localhost:5432/propchk_dev
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.profiles.active=local

# Microsoft Teams Webhook URL for Lead Alerts
teams.webhook.url=${TEAMS_WEBHOOK_URL:https://default3459577eb39a4c35b9b786c2735f24.49.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/2c690606732d43e0a9db6d26432a1bdb/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=jRuG_F01_1pih4Qzg7wVNSKMDaQXaO94liWMHSIGvsM}

# Frontend Portal Base URL
portal.frontend.url=${PORTAL_FRONTEND_URL:https://propchck.netlify.app}

# Backend API Base URL
app.backend.base-url=${BACKEND_BASE_URL:https://propcheck-be.onrender.com}

# ─── SMTP / Email Configuration ───────────────────────────────────────────────
# Set SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS as environment variables
# For local dev you can use Mailtrap: host=sandbox.smtp.mailtrap.io, port=2525
spring.mail.host=${SMTP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USER:your_mailtrap_user}
spring.mail.password=${SMTP_PASS:your_mailtrap_pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Suppress NoSuchProviderException if mail is not configured in test/local
spring.mail.test-connection=false
