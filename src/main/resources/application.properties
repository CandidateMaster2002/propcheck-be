server.port=${PORT:${SERVER_PORT:8080}}

# PostgreSQL Datasource Configuration
# Supports Render / Cloud environment variables (SPRING_DATASOURCE_URL or DATABASE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/propchk_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Zoho CRM Credentials
zoho.crm.client-id=${ZOHO_CRM_CLIENT_ID:}
zoho.crm.client-secret=${ZOHO_CRM_CLIENT_SECRET:}
zoho.crm.refresh-token=${ZOHO_CRM_REFRESH_TOKEN:}

# Microsoft Teams Webhook URL for Lead Alerts
teams.webhook.url=${TEAMS_WEBHOOK_URL:https://default3459577eb39a4c35b9b786c2735f24.49.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/2c690606732d43e0a9db6d26432a1bdb/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=jRuG_F01_1pih4Qzg7wVNSKMDaQXaO94liWMHSIGvsM}

# Frontend Portal Base URL
portal.frontend.url=${PORTAL_FRONTEND_URL:https://propchck.netlify.app}

# Backend API Base URL
app.backend.base-url=${BACKEND_BASE_URL:https://propcheck-be.onrender.com}

# ─── SMTP / Email Configuration ───────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false
